<body>
  <div class="header">
    <h1>Lily AI Companion</h1>
    <p style="color:white;">Offline Mode + Continuous Voice Listening</p>
  </div>
  <div class="chat-area" id="chatArea">
    <div style="text-align:center;color:#666;">💭 Hi! I'm Lily. Say "talk to me" for voice mode.</div>
  </div>
  <div class="input-area">
    <input id="messageInput" type="text" placeholder="Type your message...">
    <button id="sendButton" type="button">Send</button>
    <button id="jokeButton" type="button">Tell me a joke</button>
    <button id="voiceButton" type="button">🎤 Voice</button>
  </div>

<script>
  const chatArea = document.getElementById('chatArea');
  const messageInput = document.getElementById('messageInput');
  const sendButton = document.getElementById('sendButton');
  const jokeButton = document.getElementById('jokeButton');
  const voiceButton = document.getElementById('voiceButton');

  let voiceMode = false;

  function addMessage(text, sender, isCode = false) {
    const div = document.createElement('div');
    div.className = `message ${sender}-message`;
    if (isCode) {
      const codeBlock = document.createElement('div');
      codeBlock.className = 'code-block';
      codeBlock.textContent = text;
      div.appendChild(codeBlock);
    } else {
      div.textContent = text;
    }
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
  }

  function getOfflineResponse(userMessage) {
    const lower = userMessage.toLowerCase();
    if (lower.includes("joke")) return "Why did the computer go to therapy? It had too many bugs! 😂";
    if (lower.includes("code")) return "Here's a simple JavaScript snippet:\nfunction greet(){console.log('Hello!');}";
    if (lower.includes("sad")) return "I'm sorry you're feeling sad. You're not alone—I’m here for you.";
    if (lower.includes("happy")) return "That’s great! I’m happy for you!";
    if (lower.includes("talk to me")) {
      voiceMode = true;
      return "Voice mode activated! I'm listening continuously.";
    }
    return "I hear you. Tell me more!";
  }

  function speak(text) {
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = 'en-US';
    speechSynthesis.speak(utterance);
  }

  function startContinuousVoiceInput() {
    const recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = 'en-US';
    recognition.continuous = true;
    recognition.interimResults = false;
    recognition.start();

    recognition.onresult = (event) => {
      const voiceText = event.results[event.results.length - 1][0].transcript;
      addMessage(voiceText, 'user');
      const response = getOfflineResponse(voiceText);
      addMessage(response, 'ai');
      if (voiceMode) speak(response);
    };

    recognition.onerror = (event) => {
      console.error("Voice recognition error:", event.error);
    };
  }

  sendButton.addEventListener('click', () => {
    const message = messageInput.value.trim();
    if (!message) return;
    messageInput.value = '';
    addMessage(message, 'user');
    const response = getOfflineResponse(message);
    addMessage(response, 'ai');
    if (voiceMode) speak(response);
  });

  jokeButton.addEventListener('click', () => {
    const response = getOfflineResponse("joke");
    addMessage(response, 'ai');
    if (voiceMode) speak(response);
  });

  voiceButton.addEventListener('click', () => {
    startContinuousVoiceInput();
    addMessage("Listening... Say 'talk to me' to activate voice responses.", 'ai');
  });
</script>
</body>
</html>
